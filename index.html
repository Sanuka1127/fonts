<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonts-New</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#000 url(bg.jpg) center/cover fixed;display:flex;flex-direction:column;align-items:center;padding:16px}
body.no-bg{background: linear-gradient(135deg,#0f0c29,#302b63,#24243e) !important}
#loader{position:fixed;inset:0;background:#000 url(loading.jpg) center/cover no-repeat;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s}
#loader::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.65);z-index:0}
#loader > *{position:relative;z-index:1}
#loader.hide{opacity:0;pointer-events:none}
.spinner{width:55px;height:55px;border:4px solid rgba(255,255,255,0.2);border-top:4px solid #00aaff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title{color:#fff;font-size:28px;font-weight:900;margin:18px 0;text-shadow:0 0 20px #00aaff}
.sub{color:#fff;opacity:0.8;font-size:13px;margin-bottom:12px}
.main-input{width:100%;max-width:520px;padding:16px 20px;border-radius:30px;border:none;outline:none;font-size:20px;text-align:center;font-weight:bold;margin-bottom:10px}
.search{width:100%;max-width:520px;padding:11px 18px;border-radius:30px;border:none;font-size:13px;margin-bottom:14px}
.grid{width:100%;max-width:540px;display:grid;gap:10px;padding-bottom:30px}
.card{background:rgba(255,255,255,0.97);padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.label{font-size:10px;color:#777;font-weight:bold;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{font-size:20px;flex:1;overflow:hidden;white-space:nowrap;margin-right:10px;min-height:26px}
.copy{background:#111;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 24px;border-radius:30px;display:none;z-index:10000}
.footer{margin:40px 0 20px;color:#fff;opacity:0.7;font-size:13px;text-align:center}
.footer b{color:#00aaff}
</style></head><body>

<div id="loader">
  <div class="spinner"></div>
  <div id="percent" style="color:#fff;font-size:42px;font-weight:900;margin-top:20px">10%</div>
  <div style="color:#fff;opacity:0.9;margin-top:5px">Loading Fonts-New...</div>
  <div style="width:240px;height:6px;background:rgba(255,255,255,0.15);border-radius:10px;margin-top:18px;overflow:hidden">
    <div id="bar" style="height:100%;width:10%;background:#00aaff;border-radius:10px;transition:width 0.2s"></div>
  </div>
</div>

<div class="title">Fonts-New ✨</div>
<div class="sub">Type & Convert</div>
<input class="main-input" id="mainInput" placeholder="Type here... ✍️" autofocus>
<input class="search" id="search" placeholder="🔍 Search font...">
<div class="grid" id="grid"></div>
<div class="toast" id="toast">Copied ✅</div>
<div class="footer">Made with 💙 by <b>Sanuka</b></div>

<script>
const bg=new Image(); bg.onerror=()=>document.body.classList.add('no-bg'); bg.src='bg.jpg';
const ld=new Image(); ld.onerror=()=>{document.getElementById('loader').style.background='#0a0a1a'}; ld.src='loading.jpg';
let p=10; const pe=document.getElementById('percent'), bar=document.getElementById('bar'), loader=document.getElementById('loader');
const iv=setInterval(()=>{p+=10; if(p>100)p=100; pe.textContent=p+'%'; bar.style.width=p+'%'; if(p>=100){clearInterval(iv); setTimeout(()=>loader.classList.add('hide'),600)}},200);

function convert(t, name){
  if(!t) return name;
  let out=""; const ln=name.toLowerCase();
  for(let ch of t){
    let low=ch.toLowerCase(), code=low.charCodeAt(0), isLetter=code>=97&&code<=122, idx=isLetter?code-97:-1;
    if(!isLetter){ out+=ch; continue; }
    
    // FIXED - UPPERCASE walatath wada karanawa, original ch eka use karala
    if(ln.includes('written')||ln==='cursive') out+=String.fromCodePoint(0x1D4B6+idx);
    else if(ln.includes('bold') && !ln.includes('serif')) out+=String.fromCodePoint(0x1D5EE+idx);
    else if(ln==='italic' || ln==='𝘪𝘵𝘢𝘭𝘪𝘤') out+=String.fromCodePoint(0x1D608+idx);
    else if(ln.includes('outline')||ln.includes('double')) out+=String.fromCodePoint(0x1D552+idx);
    else if(ln.includes('capital')||ln==='small caps'||ln==='small'||ln.includes('ᴄᴀᴩɪᴛᴀʟ')){const m={a:'ᴀ',b:'ʙ',c:'ᴄ',d:'ᴅ',e:'ᴇ',f:'ғ',g:'ɢ',h:'ʜ',i:'ɪ',j:'ᴊ',k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'s',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'}; out+=m[low]||ch;}
    else if(ln.includes('monospace')||ln.includes('𝙼𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎')) out+=String.fromCodePoint(0x1D68A+idx);
    else if(ln.includes('serif')) out+=String.fromCodePoint(0x1D4EA+idx);
    else if(ln.includes('buttons')||ln.includes('🇧')) out+=String.fromCodePoint(0x1F1E6+idx)+" ";
    else if(ln==='high' || ln.includes('ʰⁱᵍʰ') || ln.includes('superscript')){const m={a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',q:'q',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'}; out+=m[low]||ch;}
    else if(ln.includes('medieval')||ln.includes('𝕸𝖊𝖉𝖎𝖊𝖛𝖆𝖑')||ln.includes('fraktur')||ln.includes('blackletter')||ln.includes('𝔉𝔯𝔞𝔨𝔱𝔲𝔯')||ln.includes('𝕭𝖑𝖆𝖈𝖐𝖑𝖊𝖙𝖙𝖊𝖗')) out+=String.fromCodePoint(0x1D51E+idx);
    else if(ln.includes('gummy')||ln.includes('🅶︎')){const arr=['🅶︎','🅷︎','🅸︎','🅹︎','🅺︎','🅻︎','🅼︎','🅽︎','🅾︎','🅿︎','🆀︎','🆁︎','🆂︎','🆃︎','🆄︎','🆅︎','🆆︎','🆇︎','🆈︎','🆉︎','🅰︎','🅱︎','🅲︎','🅳︎','🅴︎','🅵︎']; out+=arr[idx]||ch;}
    else if(ln.includes('lilac')||ln.includes('ℓιℓα¢')){const m={a:'ᴀ',b:'ʙ',c:'¢',d:'ᴅ',e:'ᴇ',f:'ғ',g:'ɢ',h:'ʜ',i:'ι',j:'ᴊ',k:'ᴋ',l:'ℓ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'s',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'}; out+=m[low]||ch;}
    else if(ln.includes('stike')||ln.includes('strike')||ln.includes('s̶t̶i̶k̶e̶')) out+=ch+'\u0336';
    else if(ln.includes('philo')||ln.includes('🄿🄷🄸🄻🄾')) out+=String.fromCodePoint(0x1F130+idx);
    else if(ln.includes('greenish')||ln.includes('🅖︎🅡︎🅔︎')) out+=String.fromCodePoint(0x1F150+idx);
    else if(ln.includes('roadside')||ln.includes('r̤o̤a̤d̤')) out+=ch+'\u0324';
    else if(ln.includes('beethoven')||ln.includes('вєєthσvєn')||ln.includes('beeth')){const m={a:'ᴀ',b:'в',c:'ᴄ',d:'є',e:'є',f:'ғ',g:'ɢ',h:'н',i:'ɪ',j:'ᴊ',k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'σ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'s',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'}; out+=m[low]||ch;}
    else if(ln.includes('breaks')||ln.includes('b⃠')||ln.includes('birtel')) out+=ch+'\u20E0';
    else if(ln.includes('bluish')||ln.includes('Ⓑ︎')||ln.includes('circled')) out+=String.fromCodePoint(0x24B6+idx);
    else if(ln.includes('underline')||ln.includes('u̲n̲d̲')) out+=ch+'\u0332';
    else if(ln.includes('spacious')||ln.includes('ｓｐａｃｉｏｕｓ')) out+=ch+' ';
    else if(ln.includes('water')||ln.includes('ẘåt̊')) out+=ch+'\u030A';
    else if(ln.includes('fun eye')||ln.includes('f̺u̺n̺')) out+=ch+'\u033A';
    else out+=ch;
  }
  return out;
}

const styles=["𝓦𝓻𝓲𝓽𝓽𝓮𝓷","𝗕𝗢𝗟𝗗","𝘪𝘵𝘢𝘭𝘪𝘤","𝕆𝕦𝕥𝕝𝕚𝕟𝕖","ᴄᴀᴩɪᴛᴀʟ","𝙼𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎","𝐒𝐞𝐫𝐢𝐟","🇧‌🇺‌🇹‌🇹‌🇴‌🇳‌🇸‌","ʰⁱᵍʰ","𝕸𝖊𝖉𝖎𝖊𝖛𝖆𝖑","🅶︎🆄︎🅼︎🅼︎🆈︎","ℓιℓα¢","᭙ꪶ𝘴𝓽ꪮꪗ","S̶t̶i̶k̶e̶ t̶h̶r̶o̶u̶g̶h̶","🄿🄷🄸🄻🄾🅂🄾🄿🄷🅈","🅖︎🅡︎🅔︎🅔︎🅝︎🅘︎🅢︎🅗︎","R̤o̤a̤d̤s̤i̤d̤e̤","вєєthσvєn","👌🌱🎵🅰⭕","B⃠r⃠e⃠a⃠k⃠s⃠","Ⓑ︎ⓛ︎ⓤ︎ⓘ︎ⓢ︎ⓗ︎","ᑕᒪᗩIᖇE","U̲n̲d̲e̲r̲l̲i̲n̲e̲","ΓЯД∇ΞL","Ｇ✿dd㉫＄＄","†◎мм◎ґґ◎ẘ","şųķovę","爪モㄥㄥ口山","ｓｐａｃｉｏｕｓ","W̊åt̊e̊r̊","ꀍꂦꎭꏂꌃꂦꀎꈤꀷ","SPΔRRΩШ","тԻᾰḉк","Ѧℓї℮η","F̺u̺n̺ e̺y̺e̺","iႶႽႠႩႶႠ"];

let cur=[]; function build(t){return styles.map(n=>({name:n,sample:convert(t,n)}))}
function render(list){
  cur=list; const g=document.getElementById('grid'); g.innerHTML='';
  list.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div style="flex:1;overflow:hidden"><div class="label">${f.name}</div><div class="preview">${f.sample}</div></div><button class="copy" data-i="${i}">Copy</button>`;
    g.appendChild(d);
  });
  g.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
    const it=cur[parseInt(b.dataset.i)];
    navigator.clipboard.writeText(it.sample);
    document.getElementById('toast').style.display='block'; b.textContent='Done!';
    setTimeout(()=>{document.getElementById('toast').style.display='none'; b.textContent='Copy'},1000);
  }));
}
document.getElementById('mainInput').addEventListener('input',e=>render(build(e.target.value)));
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  if(!q){render(build(document.getElementById('mainInput').value)); return;}
  render(cur.filter(f=>f.name.toLowerCase().includes(q)));
});
render(build(""));
</script></body></html>
