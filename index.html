<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonts-New</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#000 url(bg.jpg) center/cover fixed;display:flex;flex-direction:column;align-items:center;padding:16px}
body.no-bg{background: linear-gradient(135deg,#0f0c29,#302b63,#24243e) !important}
#loader{position:fixed;inset:0;background:#000 url(loading.jpg) center/cover no-repeat;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s}
#loader::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.65);z-index:0}
#loader > *{position:relative;z-index:1}
#loader.hide{opacity:0;pointer-events:none}
.spinner{width:55px;height:55px;border:4px solid rgba(255,255,255,0.2);border-top:4px solid #00aaff;border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 15px #00aaff}
@keyframes spin{to{transform:rotate(360deg)}}
.title{color:#fff;font-size:28px;font-weight:900;margin:18px 0;text-shadow:0 0 20px #00aaff, 0 3px 10px #000;letter-spacing:1px}
.sub{color:#fff;opacity:0.8;font-size:13px;margin-bottom:12px}
.main-input{width:100%;max-width:520px;padding:16px 20px;border-radius:30px;border:none;outline:none;font-size:20px;text-align:center;font-weight:bold;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,170,255,0.4)}
.search{width:100%;max-width:520px;padding:11px 18px;border-radius:30px;border:none;font-size:13px;margin-bottom:14px}
.grid{width:100%;max-width:540px;display:grid;gap:10px;padding-bottom:30px}
.card{background:rgba(255,255,255,0.97);padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 15px rgba(0,0,0,0.3)}
.label{font-size:10px;color:#777;font-weight:bold;letter-spacing:0.5px;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preview{font-size:20px;flex:1;overflow:hidden;white-space:nowrap;margin-right:10px;min-height:26px}
.copy{background:#111;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;transition:0.15s}
.copy:active{transform:scale(0.92)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 24px;border-radius:30px;display:none;z-index:10000}
.footer{margin:40px 0 20px;color:#fff;opacity:0.7;font-size:13px;text-align:center;text-shadow:0 1px 5px #000}
.footer b{color:#00aaff;text-shadow:0 0 10px #00aaff}
</style></head><body>

<div id="loader">
  <div class="spinner"></div>
  <div id="percent" style="color:#fff;font-size:42px;font-weight:900;margin-top:20px;text-shadow:0 0 15px #00aaff">10%</div>
  <div style="color:#fff;opacity:0.9;margin-top:5px;letter-spacing:1px">Loading Fonts-New...</div>
  <div style="width:240px;height:6px;background:rgba(255,255,255,0.15);border-radius:10px;margin-top:18px;overflow:hidden">
    <div id="bar" style="height:100%;width:10%;background:linear-gradient(90deg,#00aaff,#00ffaa);border-radius:10px;transition:width 0.2s"></div>
  </div>
</div>

<div class="title">Fonts-New ✨</div>
<div class="sub">Type & Convert - 60+ Stylish Fonts</div>
<input class="main-input" id="mainInput" placeholder="Type here... ✍️" autofocus>
<input class="search" id="search" placeholder="🔍 Search font...">

<div class="grid" id="grid"></div>
<div class="toast" id="toast">Copied ✅</div>
<div class="footer">Made with 💙 by <b>Sanuka</b> 🤭</div>

<script>
const bg=new Image(); bg.onerror=()=>document.body.classList.add('no-bg'); bg.src='bg.jpg';
const ld=new Image(); ld.onerror=()=>{document.getElementById('loader').style.background='#0a0a1a'}; ld.src='loading.jpg';

let p=10; const pe=document.getElementById('percent'), bar=document.getElementById('bar'), loader=document.getElementById('loader');
const iv=setInterval(()=>{p+=10; if(p>100)p=100; pe.textContent=p+'%'; bar.style.width=p+'%'; if(p>=100){clearInterval(iv); setTimeout(()=>loader.classList.add('hide'),600)}},200);

function convertText(t, type){
  try{
    if(!t) return type;
    let r=""; for(let ch of t){
      let l=ch.toLowerCase(), code=l.charCodeAt(0);
      if(code<97||code>122){ r+=ch; continue; }
      let i=code-97;
      switch(type){
        case 'Bold': r+=String.fromCodePoint(0x1D5EE+i); break;
        case 'Italic': r+=String.fromCodePoint(0x1D608+i); break;
        case 'Bold Italic': r+=String.fromCodePoint(0x1D63C+i); break;
        case 'Double Struck': r+=String.fromCodePoint(0x1D552+i); break;
        case 'Cursive': r+=String.fromCodePoint(0x1D4B6+i); break;
        case 'Monospace': r+=String.fromCodePoint(0x1D68A+i); break;
        case 'Circled': r+=String.fromCodePoint(0x24B6+i); break;
        case 'Full Width': r+=String.fromCodePoint(0xFF21+i); break;
        case 'Small Caps': const sc={a:'ᴀ',b:'ʙ',c:'ᴄ',d:'ᴅ',e:'ᴇ',f:'ғ',g:'ɢ',h:'ʜ',i:'ɪ',j:'ᴊ',k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'s',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'}; r+=sc[l]||ch; break;
        case 'Fraktur': r+=String.fromCodePoint(0x1D51E+i); break;
        case 'Blackletter': r+=String.fromCodePoint(0x1D5A0+i); break;
        case 'Sans Serif': r+=String.fromCodePoint(0x1D5A0-26+i); break;
        case 'Sans Serif Bold': r+=String.fromCodePoint(0x1D5EE+i); break;
        case 'Sans Serif Italic': r+=String.fromCodePoint(0x1D608+i); break;
        case 'Sans Serif Bold Italic': r+=String.fromCodePoint(0x1D63C+i); break;
        case 'Wide Text': r+=String.fromCodePoint(0xFF21+i); break;
        case 'Mathematical Bold': r+=String.fromCodePoint(0x1D400+i); break;
        case 'Mathematical Italic': r+=String.fromCodePoint(0x1D434+i); break;
        case 'Parenthesis Font': r+=String.fromCodePoint(0x249C+i); break;
        case 'Square Brackets': r+=String.fromCodePoint(0x1F130+i); break;
        case 'Negative Circled': r+=String.fromCodePoint(0x1F150+i); break;
        case 'Japanese Style': r+=ch; break;
        case 'Script Bold': r+=String.fromCodePoint(0x1D4EA+i); break;
        case 'Superscript': const sup={a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',q:'q',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'}; r+=sup[l]||ch; break;
        case 'Star Wrapped': r+=ch; break;
        case 'Ribbon Style': r+=ch; break;
        case 'Glitter Style': r+=ch; break;
        case 'Neon Style': r+=ch; break;
        case 'Diamond Style': r+=ch; break;
        case 'Flower Style': r+=ch; break;
        // Old fonts
        case '𝓦𝓻𝓲𝓽𝓽𝓮𝓷': r+=String.fromCodePoint(0x1D4EA+i); break;
        case '𝘪𝘵𝘢𝘭𝘪𝘤': r+=String.fromCodePoint(0x1D44E+i); break;
        case '𝕆𝕦𝕥𝕝𝕚𝕟𝕖': r+=String.fromCodePoint(0x1D552+i); break;
        default: 
          if(type.includes('Strike')) r+=ch+'\u0336';
          else if(type.includes('Underline')) r+=ch+'\u0332';
          else if(type.includes('Roadside')) r+=ch+'\u0324';
          else if(type.includes('Breaks')) r+=ch+'\u20E0';
          else if(type.includes('Fun eye')) r+=ch+'\u033A';
          else if(type.includes('Water')) r+=ch+'\u030A';
          else if(type.includes('spacious')) r+=ch+' ';
          else r+=ch;
          break;
      }
    }
    // Wrap styles
    if(!t) return type;
    if(type==='Star Wrapped') return '✨ '+r+' ✨';
    if(type==='Ribbon Style') return '🎀【 '+r+' 】🎀';
    if(type==='Glitter Style') return '✧･ﾟ: *✧･ﾟ:* '+r+' *:･ﾟ✧*:･ﾟ✧';
    if(type==='Neon Style') return '『🔥』'+r+'『🔥』';
    if(type==='Diamond Style') return '♦️【 '+r+' 】♦️';
    if(type==='Flower Style') return '🌸「 '+r+' 」🌸';
    return r;
  }catch(e){ return t||type; }
}

const styles=[
"Bold","Italic","Bold Italic","Double Struck","Cursive","Monospace","Circled","Full Width","Small Caps","Fraktur","Blackletter","Sans Serif","Sans Serif Bold","Sans Serif Italic","Sans Serif Bold Italic","Wide Text","Mathematical Bold","Mathematical Italic","Parenthesis Font","Square Brackets","Negative Circled","Japanese Style","Script Bold","Superscript",
"Star Wrapped","Ribbon Style","Glitter Style","Neon Style","Diamond Style","Flower Style",
"𝓦𝓻𝓲𝓽𝓽𝓮𝓷","𝗕𝗢𝗟𝗗","𝕆𝕦𝕥𝕝𝕚𝕟𝕖","ᴄᴀᴩɪᴛᴀʟ","ʰⁱᵍʰ","S̶t̶i̶k̶e̶ t̶h̶r̶o̶u̶g̶h̶","U̲n̲d̲e̲r̲l̲i̲n̲e̲","R̤o̤a̤d̤s̤i̤d̤e̤","B⃠r⃠e⃠a⃠k⃠s⃠","F̺u̺n̺ e̺y̺e̺","W̊åt̊e̊r̊","ｓｐａｃｉｏｕｓ","вєєthσvєn","Ⓑ︎ⓛ︎ⓤ︎ⓘ︎ⓢ︎ⓗ︎"
];

let cur=[]; function build(t){return styles.map(n=>({name:n,sample:convertText(t,n)}))}
function render(list){
  cur=list; const g=document.getElementById('grid'); g.innerHTML='';
  list.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div style="flex:1;overflow:hidden"><div class="label">${f.name}</div><div class="preview">${f.sample}</div></div><button class="copy" data-i="${i}">Copy</button>`;
    g.appendChild(d);
  });
  g.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
    const it=cur[parseInt(b.dataset.i)];
    navigator.clipboard.writeText(it.sample).catch(()=>{
      const ta=document.createElement('textarea');ta.value=it.sample;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    });
    document.getElementById('toast').style.display='block'; b.textContent='Done!';
    setTimeout(()=>{document.getElementById('toast').style.display='none'; b.textContent='Copy'},1000);
  }));
}

document.getElementById('mainInput').addEventListener('input',e=>render(build(e.target.value)));
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  if(!q){render(build(document.getElementById('mainInput').value)); return;}
  render(cur.filter(f=>f.name.toLowerCase().includes(q) || f.sample.toLowerCase().includes(q)));
});
render(build(""));
</script></body></html>
