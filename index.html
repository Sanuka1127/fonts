<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonts-New</title><link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#000 url(bg.jpg) center/cover fixed;display:flex;flex-direction:column;align-items:center;padding:16px}
.title{color:#fff;font-size:22px;font-weight:900;margin:14px 0}
.main-input{width:100%;max-width:500px;padding:16px 20px;border-radius:30px;border:none;outline:none;font-size:20px;text-align:center;font-weight:bold;margin-bottom:10px}
.search{width:100%;max-width:500px;padding:11px 18px;border-radius:30px;border:none;font-size:13px;margin-bottom:14px}
.grid{width:100%;max-width:520px;display:grid;gap:9px;padding-bottom:100px}
.card{background:rgba(255,255,255,.96);padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.label{font-size:9px;color:#999;text-transform:uppercase}
.preview{font-size:19px;flex:1;overflow:hidden;white-space:nowrap;margin-right:10px}
.copy{background:#111;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:30px;display:none}
</style></head><body>
<div class="title">Fonts-New ✨ Type & Convert</div>
<input class="main-input" id="mainInput" placeholder="Type here... ✍️" autofocus>
<input class="search" id="search" placeholder="🔍 Search font...">
<div class="grid" id="grid"></div>
<div class="toast" id="toast">Copied ✅</div>
<script>
function convert(t,style){
 let out="";for(let ch of t){let l=ch.toLowerCase();let c=l.charCodeAt(0);if(c<97||c>122){out+=style==='spacious'?ch+' ':ch;continue}let i=c-97;switch(style){
 case 'Written':out+=String.fromCodePoint(0x1D4EA+i);break;
 case 'BOLD':out+=String.fromCodePoint(0x1D5EE+i);break;
 case 'italic':out+=String.fromCodePoint(0x1D44E+i);break;
 case 'Outline':out+=String.fromCodePoint(0x1D552+i);break;
 case 'Monospace':out+=String.fromCodePoint(0x1D68A+i);break;
 case 'Serif Bold':out+=String.fromCodePoint(0x1D5EE+i);break;
 case 'Buttons':out+=String.fromCodePoint(0x1F1E6+i)+" ";break;
 case 'high':const s={a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',q:'q',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'};out+=s[l]||ch;break;
 case 'Capital Small':const m={a:'ᴀ',b:'ʙ',c:'ᴄ',d:'ᴅ',e:'ᴇ',f:'ғ',g:'ɢ',h:'ʜ',i:'ɪ',j:'ᴊ',k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'s',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'};out+=m[l]||ch;break;
 case 'Strike through':out+=ch+'\u0336';break;
 case 'Underline':out+=ch+'\u0332';break;
 case 'Roadside':out+=ch+'\u0324';break;
 case 'Breaks':out+=ch+'\u20E0';break;
 case 'Fun eye':out+=ch+'\u033A';break;
 case 'Water':out+=ch+'\u030A';break;
 case 'spacious':out+=ch+' ';break;
 default:out+=ch;}}return out;}
const styles=["Written","BOLD","italic","Outline","Capital Small","Monospace","Serif Bold","Buttons","high","Strike through","Underline","Roadside","Breaks","spacious","Water","Fun eye"];
let cur=[];function build(t){return styles.map(n=>({name:n,sample:t?convert(t,n):n}))}
function render(list){cur=list;const g=document.getElementById('grid');g.innerHTML='';list.forEach((f,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div style="flex:1;overflow:hidden"><div class="label">${f.name}</div><div class="preview">${f.sample}</div></div><button class="copy" data-i="${i}">Copy</button>`;g.appendChild(d)});g.querySelectorAll('.copy').forEach(b=>{b.addEventListener('click',()=>{const it=cur[parseInt(b.dataset.i)];navigator.clipboard.writeText(it.sample);document.getElementById('toast').style.display='block';b.textContent='Done!';setTimeout(()=>{document.getElementById('toast').style.display='none';b.textContent='Copy'},1000)})})}
document.getElementById('mainInput').addEventListener('input',e=>{render(build(e.target.value))});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(cur.filter(f=>f.name.toLowerCase().includes(q)))});
render(build(""));
</script></body></html>
