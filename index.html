<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonts-New</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#000 url(bg.jpg) center/cover fixed;display:flex;flex-direction:column;align-items:center;padding:16px}
body.no-bg{background: linear-gradient(135deg,#0f0c29,#302b63,#24243e) !important}
#loader{position:fixed;inset:0;background:#000 url(loading.jpg) center/cover no-repeat;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s}
#loader::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.65);z-index:0}
#loader > *{position:relative;z-index:1}
#loader.hide{opacity:0;pointer-events:none}
.spinner{width:55px;height:55px;border:4px solid rgba(255,255,255,0.2);border-top:4px solid #00aaff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title{color:#fff;font-size:30px;font-weight:900;margin:18px 0;text-shadow:0 0 20px #00aaff;letter-spacing:1px}
.sub{color:#fff;opacity:0.8;font-size:13px;margin-bottom:14px}
.main-input{width:100%;max-width:520px;padding:16px 20px;border-radius:30px;border:none;outline:none;font-size:20px;text-align:center;font-weight:bold;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,170,255,0.4)}
.search{width:100%;max-width:520px;padding:11px 18px;border-radius:30px;border:none;font-size:13px;margin-bottom:14px}
.grid{width:100%;max-width:540px;display:grid;gap:10px;padding-bottom:30px}
.card{background:rgba(255,255,255,0.97);padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 15px rgba(0,0,0,0.3)}
.label{font-size:10px;color:#777;font-weight:bold;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preview{font-size:20px;flex:1;overflow:hidden;white-space:nowrap;margin-right:10px;min-height:26px}
.copy{background:#111;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;transition:0.15s}
.copy:active{transform:scale(0.92)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 24px;border-radius:30px;display:none;z-index:10000}
.footer{margin:40px 0 20px;color:#fff;opacity:0.7;font-size:13px;text-align:center;text-shadow:0 1px 5px #000}
.footer b{color:#00aaff;text-shadow:0 0 10px #00aaff}
</style></head><body>
<div id="loader"><div class="spinner"></div><div id="percent" style="color:#fff;font-size:42px;font-weight:900;margin-top:20px;text-shadow:0 0 15px #00aaff">10%</div><div style="color:#fff;opacity:0.9;margin-top:5px;letter-spacing:1px">Loading Fonts-New...</div><div style="width:240px;height:6px;background:rgba(255,255,255,0.15);border-radius:10px;margin-top:18px;overflow:hidden"><div id="bar" style="height:100%;width:10%;background:linear-gradient(90deg,#00aaff,#00ffaa);border-radius:10px;transition:width 0.2s"></div></div></div>
<div class="title">Fonts-New ✨</div>
<div class="sub">Type & Convert - 70+ Stylish Fonts</div>
<input class="main-input" id="mainInput" placeholder="Type here... ✍️" autofocus>
<input class="search" id="search" placeholder="🔍 Search font...">
<div class="grid" id="grid"></div>
<div class="toast" id="toast">Copied ✅</div>
<div class="footer">Made with 💙 by <b>Sanuka</b> 🤭</div>
<script>
const bg=new Image(); bg.onerror=()=>document.body.classList.add('no-bg'); bg.src='bg.jpg';
const ld=new Image(); ld.onerror=()=>{document.getElementById('loader').style.background='#0a0a1a'}; ld.src='loading.jpg';
let p=10; const pe=document.getElementById('percent'), bar=document.getElementById('bar'), loader=document.getElementById('loader');
const iv=setInterval(()=>{p+=10; if(p>100)p=100; pe.textContent=p+'%'; bar.style.width=p+'%'; if(p>=100){clearInterval(iv); setTimeout(()=>loader.classList.add('hide'),600)}},200);

const smallMap={a:'ᴀ',b:'ʙ',c:'ᴄ',d:'ᴅ',e:'ᴇ',f:'ғ',g:'ɢ',h:'ʜ',i:'ɪ',j:'ᴊ',k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'s',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'};
const superMap={a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',q:'q',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'};

function convert(t, style){
 if(!t) return style;
 let out=""; let ln=style.toLowerCase();
 for(let ch of t){
  let low=ch.toLowerCase(); let code=low.charCodeAt(0); let isL=code>=97&&code<=122; let idx=isL?code-97:-1;
  if(!isL){out+=ch; continue;}
  // --- Exact fancy names (old) - BUG FIXED ---
  if(style==="𝓦𝓻𝓲𝓽𝓽𝓮𝓷" || style==="Script Bold" || style==="Cursive") out+=String.fromCodePoint(0x1D4EA+idx);
  else if(style==="𝗕𝗢𝗟𝗗" || style==="Bold" || style==="Sans Serif Bold" || style==="Wide Text" || style==="Full Width") { if(ln.includes("full")||ln.includes("wide")) out+=String.fromCodePoint(0xFF21+idx); else out+=String.fromCodePoint(0x1D5EE+idx); }
  else if(style==="𝘪𝘵𝘢𝘭𝘪𝘤" || style==="Italic" || style==="Sans Serif Italic") out+=String.fromCodePoint(0x1D608+idx);
  else if(style==="Bold Italic" || style==="Sans Serif Bold Italic") out+=String.fromCodePoint(0x1D63C+idx);
  else if(style==="𝕆𝕦𝕥𝕝𝕚𝕟𝕖" || style==="Double Struck") out+=String.fromCodePoint(0x1D552+idx);
  else if(style==="ᴄᴀᴩɪᴛᴀʟ" || style==="Sᴍᴀʟʟ Cᴀᴘs" || style==="Small Caps" || style==="ᑕᒪᗩIᖇE" || style==="ΓЯД∇ΞL") out+=smallMap[low]||ch;
  else if(style==="𝙼𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎" || style==="Monospace") out+=String.fromCodePoint(0x1D68A+idx);
  else if(style==="𝐒𝐞𝐫𝐢𝐟" || style==="Sans Serif" || style==="Mathematical Bold") out+=String.fromCodePoint(0x1D400+idx);
  else if(style==="Mathematical Italic") out+=String.fromCodePoint(0x1D434+idx);
  else if(style==="Ⓑ︎ⓛ︎ⓤ︎ⓘ︎ⓢ︎ⓗ︎" || style==="Circled") out+=String.fromCodePoint(0x24B6+idx);
  else if(style==="𝕸𝖊𝖉𝖎𝖊𝖛𝖆𝖑" || style==="𝔉𝔯𝔞𝔨𝔱𝔲𝔯 (𝔊𝔬𝔱𝔥𝔦𝔠)" || style==="𝕭𝖑𝖆𝖈𝖐𝖑𝖊𝖙𝖙𝖊𝖗" || style==="Fraktur" || style==="Blackletter") out+=String.fromCodePoint(0x1D51E+idx);
  else if(style==="ʰⁱᵍʰ" || style==="Superscript") out+=superMap[low]||ch;
  else if(style==="Parenthesis Font") out+=String.fromCodePoint(0x249C+idx);
  else if(style==="Square Brackets" || style==="🅶︎🆄︎🅼︎🅼︎🆈︎" || style==="🄿🄷🄸🄻🄾🅂🄾🄿🄷🅈") out+=String.fromCodePoint(0x1F130+idx);
  else if(style==="Negative Circled" || style==="🅖︎🅡︎🅔︎🅔︎🅝︎🅘︎🅢︎🅗︎") out+=String.fromCodePoint(0x1F150+idx);
  else if(style==="Japanese Style") { const jp={a:'卂',b:'乃',c:'匚',d:'ᗪ',e:'乇',f:'千',g:'Ꮆ',h:'卄',i:'丨',j:'丿',k:'Ҝ',l:'ㄥ',m:'爪',n:'几',o:'ㄖ',p:'卩',q:'Ɋ',r:'尺',s:'丂',t:'ㄒ',u:'ㄩ',v:'ᐯ',w:'山',x:'乂',y:'ㄚ',z:'乙'}; out+=jp[low]||ch; }
  // Combining
  else if(style==="S̶t̶i̶k̶e̶ t̶h̶r̶o̶u̶g̶h̶" || style.includes("Strike")||style.includes("Stike")) out+=ch+'\u0336';
  else if(style==="U̲n̲d̲e̲r̲l̲i̲n̲e̲" || style==="Underline") out+=ch+'\u0332';
  else if(style==="R̤o̤a̤d̤s̤i̤d̤e̤" || style==="Roadside") out+=ch+'\u0324';
  else if(style==="B⃠r⃠e⃠a⃠k⃠s⃠" || style==="Breaks") out+=ch+'\u20E0';
  else if(style==="F̺u̺n̺ e̺y̺e̺" || style==="Fun eye") out+=ch+'\u033A';
  else if(style==="W̊åt̊e̊r̊" || style==="Water") out+=ch+'\u030A';
  else if(style==="ｓｐａｃｉｏｕｓ" || style==="spacious") out+=ch+' ';
  else if(style==="вєєthσvєn" || style==="beethoven") out+=smallMap[low]||ch;
  else out+=ch;
 }
 // Wrappers - NEW LIST
 if(ln.includes("star wrapped") || ln.includes("✨")) return '✨ '+out+' ✨';
 if(ln.includes("ribbon")) return '🎀【 '+out+' 】🎀';
 if(ln.includes("glitter")) return '✧･ﾟ: *✧･ﾟ:* '+out+' *:･ﾟ✧*:･ﾟ✧';
 if(ln.includes("neon")) return '『🔥』'+out+'『🔥』';
 if(ln.includes("diamond")) return '♦️【 '+out+' 】♦️';
 if(ln.includes("flower")) return '🌸「 '+out+' 」🌸';
 if(ln.includes("japanese")) return out; // already converted
 return out;
}

const styles=[
"Bold","Italic","Bold Italic","Double Struck","Cursive","Monospace","Circled","Full Width","Sᴍᴀʟʟ Cᴀᴘs","𝔉𝔯𝔞𝔨𝔱𝔲𝔯 (𝔊𝔬𝔱𝔥𝔦𝔠)","𝕭𝖑𝖆𝖈𝖐𝖑𝖊𝖙𝖙𝖊𝖗","Sans Serif","Sans Serif Bold","Sans Serif Italic","Sans Serif Bold Italic","Wide Text","Mathematical Bold","Mathematical Italic","Parenthesis Font","Square Brackets","Negative Circled","Japanese Style","Script Bold","Superscript","✨ Star Wrapped","🎀 Ribbon Style","💫 Glitter Style","🔥 Neon Style","💎 Diamond Style","🌸 Flower Style",
"𝓦𝓻𝓲𝓽𝓽𝓮𝓷","𝗕𝗢𝗟𝗗","𝘪𝘵𝘢𝘭𝘪𝘤","𝕆𝕦𝕥𝕝𝕚𝕟𝕖","ᴄᴀᴩɪᴛᴀʟ","𝙼𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎","𝐒𝐞𝐫𝐢𝐟","🇧‌🇺‌🇹‌🇹‌🇴‌🇳‌🇸‌","ʰⁱᵍʰ","𝕸𝖊𝖉𝖎𝖊𝖛𝖆𝖑","🅶︎🆄︎🅼︎🅼︎🆈︎","ℓιℓα¢","᭙ꪶ𝘴𝓽ꪮꪗ","S̶t̶i̶k̶e̶ t̶h̶r̶o̶u̶g̶h̶","🄿🄷🄸🄻🄾🅂🄾🄿🄷🅈","🅖︎🅡︎🅔︎🅔︎🅝︎🅘︎🅢︎🅗︎","R̤o̤a̤d̤s̤i̤d̤e̤","вєєthσvєn","👌🌱🎵🅰⭕","B⃠r⃠e⃠a⃠k⃠s⃠","Ⓑ︎ⓛ︎ⓤ︎ⓘ︎ⓢ︎ⓗ︎","ᑕᒪᗩIᖇE","U̲n̲d̲e̲r̲l̲i̲n̲e̲","ΓЯД∇ΞL","Ｇ✿dd㉫＄＄","†◎мм◎ґґ◎ẘ","şųķovę","爪モㄥㄥ口山","ｓｐａｃｉｏｕｓ","W̊åt̊e̊r̊","ꀍꂦꎭꏂꌃꂦꀎꈤꀷ","SPΔRRΩШ","тԻᾰḉк","Ѧℓї℮η","F̺u̺n̺ e̺y̺e̺","iႶႽႠႩႶႠ"
];

let cur=[]; function build(t){return styles.map(n=>({name:n,sample:convert(t,n)}))}
function render(list){
 cur=list; const g=document.getElementById('grid'); g.innerHTML='';
 list.forEach((f,i)=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div style="flex:1;overflow:hidden"><div class="label">${f.name}</div><div class="preview">${f.sample}</div></div><button class="copy" data-i="${i}">Copy</button>`;
  g.appendChild(d);
 });
 g.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
  const it=cur[parseInt(b.dataset.i)];
  navigator.clipboard.writeText(it.sample).catch(()=>{
   const ta=document.createElement('textarea');ta.value=it.sample;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  });
  document.getElementById('toast').style.display='block'; b.textContent='Done!';
  setTimeout(()=>{document.getElementById('toast').style.display='none'; b.textContent='Copy'},1000);
 }));
}
document.getElementById('mainInput').addEventListener('input',e=>render(build(e.target.value)));
document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 if(!q){render(build(document.getElementById('mainInput').value)); return;}
 render(cur.filter(f=>f.name.toLowerCase().includes(q) || f.sample.toLowerCase().includes(q)));
});
render(build(""));
</script></body></html>
